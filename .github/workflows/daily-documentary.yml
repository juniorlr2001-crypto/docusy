name: Daily Documentary Generator & YouTube Auto-Upload

on:
  schedule:
    # Tanda Mañana (9:17 AM y 9:47 AM America/Mexico_City, UTC-6)
    - cron: '17 15 * * *'
    - cron: '47 15 * * *'
    # Tanda Tarde (3:17 PM y 3:47 PM America/Mexico_City, UTC-6)
    - cron: '17 21 * * *'
    - cron: '47 21 * * *'
  workflow_call:
  workflow_dispatch:
    inputs:
      category:
        description: 'Pilar opcional (supervivencia | errores_historicos | misterios | ciencia_extrema)'
        required: false
        default: ''
      custom_topic:
        description: 'Tema personalizado opcional (dejar vacío para rotación automática)'
        required: false
        default: ''
      privacy:
        description: 'Privacidad en YouTube (public | unlisted | private)'
        required: false
        default: 'public'
      trigger_source:
        description: 'Origen del disparo (manual | cloudflare_cron)'
        required: false
        default: 'manual'

permissions:
  contents: write

concurrency:
  group: docu-viral-daily-production
  cancel-in-progress: false

jobs:
  produce-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Load latest topic history from radar-state branch
        run: |
          if git ls-remote --exit-code --heads origin radar-state >/dev/null 2>&1; then
            git fetch origin radar-state
            git checkout origin/radar-state -- data/ || true
            git reset HEAD data/ || true
          fi

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Guard daytime Mexico schedule & deduplicate Morning/Afternoon slot
        id: schedule_guard
        run: |
          node -e '
            const fs = require("fs");
            const eventName = process.env.GH_EVENT || "";
            const triggerSource = process.env.TRIGGER_SOURCE || "manual";
            const fmt = new Intl.DateTimeFormat("en-CA", {
              timeZone: "America/Mexico_City",
              year: "numeric", month: "2-digit", day: "2-digit",
              hour: "2-digit", minute: "2-digit", hour12: false
            });
            const parts = Object.fromEntries(fmt.formatToParts(new Date()).map(p => [p.type, p.value]));
            const mxDate = `${parts.year}-${parts.month}-${parts.day}`;
            const mxHour = parseInt(parts.hour, 10);
            console.log(`Hora actual en Ciudad de México: ${mxDate} ${parts.hour}:${parts.minute} | evento=${eventName} | origen=${triggerSource}`);

            if (eventName === "schedule" || eventName === "workflow_call" || triggerSource === "cloudflare_cron") {
              if (mxHour < 8 || mxHour >= 21) {
                console.log(`⏸️ Disparo fuera de horario diurno (${mxHour}:00 MX). Se omite para no publicar de noche.`);
                fs.appendFileSync(process.env.GITHUB_OUTPUT, "skip=true\n");
                process.exit(0);
              }
              const isMorning = mxHour < 15;
              try {
                const hist = JSON.parse(fs.readFileSync("data/published_topics.json", "utf8"));
                const log = Array.isArray(hist.historyLog) ? hist.historyLog : [];
                let todayCount = 0;
                let morningCount = 0;
                let afternoonCount = 0;
                for (const entry of log) {
                  if (!entry.usedAt || entry.usedAt === "backfilled") continue;
                  const d = new Date(entry.usedAt);
                  if (isNaN(d.getTime())) continue;
                  const ep = Object.fromEntries(fmt.formatToParts(d).map(p => [p.type, p.value]));
                  const eDate = `${ep.year}-${ep.month}-${ep.day}`;
                  const eHour = parseInt(ep.hour, 10);
                  if (eDate === mxDate) {
                    todayCount++;
                    if (eHour < 15) morningCount++;
                    else afternoonCount++;
                  }
                }
                if (todayCount >= 2) {
                  console.log(`✅ Ya se publicaron los 2 episodios del día (${mxDate}). Omitiendo disparo de respaldo.`);
                  fs.appendFileSync(process.env.GITHUB_OUTPUT, "skip=true\n");
                  process.exit(0);
                }
                if (isMorning && morningCount >= 1) {
                  console.log(`✅ Ya se publicó el episodio de la mañana (${mxDate}). Omitiendo disparo de respaldo matutino.`);
                  fs.appendFileSync(process.env.GITHUB_OUTPUT, "skip=true\n");
                  process.exit(0);
                }
                if (!isMorning && afternoonCount >= 1) {
                  console.log(`✅ Ya se publicó el episodio de la tarde (${mxDate}). Omitiendo disparo de respaldo vespertino.`);
                  fs.appendFileSync(process.env.GITHUB_OUTPUT, "skip=true\n");
                  process.exit(0);
                }
              } catch (e) {
                console.warn("Aviso leyendo historial:", e.message);
              }
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "skip=false\n");
          '
        env:
          GH_EVENT: ${{ github.event_name }}
          TRIGGER_SOURCE: ${{ inputs.trigger_source || 'manual' }}

      - name: Install dependencies & system fonts
        if: steps.schedule_guard.outputs.skip != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-liberation fonts-dejavu-core fontconfig
          npm ci

      - name: Generate 1080p Documentary + Bridge Short + Auto-Upload to YouTube
        if: steps.schedule_guard.outputs.skip != 'true'
        env:
          DOCU_GEMINI_API_KEY: ${{ secrets.DOCU_GEMINI_API_KEY }}
          DOCU_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.DOCU_CLOUDFLARE_ACCOUNT_ID }}
          DOCU_CLOUDFLARE_API_TOKEN: ${{ secrets.DOCU_CLOUDFLARE_API_TOKEN }}
          DOCU_PEXELS_API_KEY: ${{ secrets.DOCU_PEXELS_API_KEY }}
          DOCU_PIXABAY_API_KEY: ${{ secrets.DOCU_PIXABAY_API_KEY }}
          DOCU_FAL_KEY: ${{ secrets.DOCU_FAL_KEY }}
          DOCU_YOUTUBE_CLIENT_ID: ${{ secrets.DOCU_YOUTUBE_CLIENT_ID }}
          DOCU_YOUTUBE_CLIENT_SECRET: ${{ secrets.DOCU_YOUTUBE_CLIENT_SECRET }}
          DOCU_YOUTUBE_REFRESH_TOKEN: ${{ secrets.DOCU_YOUTUBE_REFRESH_TOKEN }}
          DOCU_YOUTUBE_PRIVACY: ${{ inputs.privacy || secrets.DOCU_YOUTUBE_PRIVACY || 'public' }}
          DOCU_CHANNEL_NAME: ${{ secrets.DOCU_CHANNEL_NAME || 'docusy' }}
          DOCU_AUTO_UPLOAD: 'true'
          DOCU_CLEAN_WORK: 'true'
        run: |
          EXTRA_ARGS="--auto-upload --clean-work"
          if [ -n "${{ inputs.category }}" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --category=${{ inputs.category }}"
          fi
          if [ -n "${{ inputs.custom_topic }}" ]; then
            npx tsx src/index.ts $EXTRA_ARGS "--topic=${{ inputs.custom_topic }}"
          else
            npx tsx src/index.ts $EXTRA_ARGS
          fi

      - name: Persist updated topic history to radar-state branch (keeps main untouched by GITHUB_TOKEN)
        if: steps.schedule_guard.outputs.skip != 'true'
        run: |
          git config user.name "juniorlr2001-crypto"
          git config user.email "262055082+juniorlr2001-crypto@users.noreply.github.com"
          git add data/
          if ! git diff --staged --quiet; then
            git commit -m "chore(radar): register published documentary episode"
            git push origin "HEAD:refs/heads/radar-state" --force
          fi

      - name: Upload episode metadata & thumbnails artifact
        if: always() && steps.schedule_guard.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: episode-package-${{ github.run_number }}
          path: |
            output/*/metadata.json
            output/*/script.json
            output/*/captions.srt
            output/*/thumbnail_16x9.jpg
            output/*/thumbnail_short_9x16.jpg
          retention-days: 30
